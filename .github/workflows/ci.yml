name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify Linux structural mutation backend
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: pnpm vitest run tests/host/mutation-backend-linux.spec.ts --reporter=verbose
      - name: Verify macOS structural mutation backend
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: pnpm vitest run tests/host/mutation-backend-darwin.spec.ts --reporter=verbose
      - run: pnpm build
      - name: Verify committed distribution
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - run: pnpm pack

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: '*.tgz'
          if-no-files-found: error
